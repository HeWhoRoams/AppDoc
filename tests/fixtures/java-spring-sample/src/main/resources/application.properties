# Spring Boot configuration (properties variant).
#
# This file is the AppDoc golden's BUG A regression pin. Before the scope fix,
# the config-catalog scope profile excluded every `*.properties` file
# (`(?i)\.properties$`), so Spring Boot's primary `application.properties` was
# silently dropped and the datasource below never reached the catalog. The
# distinct DB name `tickets_props` appears ONLY in this file (the sibling
# application.yml uses `tickets`), so its presence in config-catalog.md proves
# the .properties file was actually scanned. Its `spring.datasource.password`
# is a fake secret that must be REDACTED (never survive into any artifact).
spring.datasource.url=jdbc:mysql://db-host.internal:3306/tickets_props
spring.datasource.username=props_user
spring.datasource.password=PropsP@ss999
spring.jpa.hibernate.ddl-auto=validate
