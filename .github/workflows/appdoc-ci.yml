name: appdoc-ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  syntax-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PowerShell syntax gate
        shell: pwsh
        run: |
          ./.appdoc/scripts/powershell/ci-syntax-gate.ps1 -RootPath .
      - name: Run documentation integrity gate
        shell: pwsh
        run: |
          ./.appdoc/scripts/powershell/ci-doc-integrity-gate.ps1 -RootPath .

  golden-test:
    runs-on: ubuntu-latest
    name: Golden-file regression (framework-agnostic)
    steps:
      - uses: actions/checkout@v4
      - name: Setup PowerShell
        uses: actions/setup-pwsh@v3
      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester)) {
            Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck
          }
          "Pester $(Get-Module -ListAvailable -Name Pester | Select-Object -First 1).Version"
      - name: Run golden-file regression test
        shell: pwsh
        run: |
          Invoke-Pester -Path ./tests/powershell/test-golden-classic-asp.ps1 -Output Detailed

