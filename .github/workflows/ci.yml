name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Standard library only
        run: python tests/check_stdlib_only.py
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Smoke test
        run: python -m appdoc extract tests/samples/java-spring --out docs/appdoc
      - name: Artifact hashes
        run: python tools/artifact_hashes.py > hashes.json
      - uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.os }}-${{ matrix.python }}
          path: hashes.json

  hashes-agree:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          path: hashes
      - name: Every OS and Python wrote the same bytes
        run: python tools/artifact_hashes.py --compare hashes/*/hashes.json
