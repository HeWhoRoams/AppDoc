# appdoc-docs-gate.yml
#
# AppDoc docs-as-code gate. Copy this file into a target application's repo at
# .github/workflows/appdoc-docs-gate.yml to gate merges and pushes on the
# committed AppDoc documentation staying in lockstep with the code.
#
# Requirements on the target repo
#   - The generated AppDoc docs are committed under docs/appdoc/
#     (at minimum facts.json and application-documentation.md).
#   - Python 3.10+ on the runner. AppDoc uses the standard library only, so
#     there are no packages to install.
#
# What this gate does (all deterministic; AppDoc holds no LLM key here)
# appdoc-self:generated gate-header
#   Pinned release writes Facts schema appdoc-facts/7; the Check runs rules C1-C20.
#   `appdoc gate` regenerates the Facts in memory (no cache) and compares them with the committed
#   docs/appdoc/facts.json, then runs the Check. Exit codes:
#     0  the Facts match and the Check passes
#     1  tool error (for example the committed facts.json is missing)
#     2  Facts changed (the code changed since the docs were generated; prints a diff of at most 200 lines), or the Check failed
#     3  AppDoc upgraded (the committed Facts schema differs from the pinned AppDoc's; re-extract and refresh the docs)
#   A difference in the AppDoc version recorded in provenance.json is informational only.
# /appdoc-self:generated gate-header
#
# Pin AppDoc: APPDOC_REF below is the release tag your docs were written with.
# Upgrading AppDoc is then a deliberate change (bump the tag, re-extract, refresh).
# The skill is cloned outside the workspace ($RUNNER_TEMP), so it is never part of
# the Target the gate scans.
#
# What this gate does NOT do
#   - It does NOT rewrite the Narrative (the AI-written sections). AppDoc
#     deliberately holds no API key, no provider, and makes no network LLM call,
#     so the Narrative is written by the AI in a session. When the code changes
#     meaningfully, re-run the AppDoc skill in a session to refresh the
#     Narrative, then commit the updated docs/appdoc/ files. This workflow is
#     the deterministic tripwire that tells you when that refresh is due; the
#     Narrative refresh itself is the AI-in-the-loop step. See docs/docs-as-code.md.
#   - It does NOT run the source-to-claim audit (an AI accuracy pass).
#     --require-audit fails the gate when docs/appdoc/evidence.jsonl declares the
#     audit not performed. To also fail on advisories such as entry points the
#     document never cites, add --strict to the gate command (optional).

name: AppDoc docs gate

on:
  push:
    branches: [main]
  pull_request:

env:
  # appdoc-self:generated gate-pin
  APPDOC_REF: v2.6.0
  # /appdoc-self:generated gate-pin

jobs:
  appdoc-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the target application
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check out the AppDoc skill (outside the workspace)
        run: git clone --depth 1 --branch "$APPDOC_REF" https://github.com/HeWhoRoams/AppDoc "$RUNNER_TEMP/appdoc-skill"

      - name: Run the AppDoc gate
        run: python "$RUNNER_TEMP/appdoc-skill/run_appdoc.py" gate "$GITHUB_WORKSPACE" --require-audit
